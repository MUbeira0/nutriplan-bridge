marcar_chat_leido:
  name: Marcar chat como leído
  description: Marca como leídos todos los mensajes del chat con el dietista.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge

valorar_plato:
  name: Valorar plato
  description: >-
    Envía una valoración (1-5) para un plato. Usa el "super_plato_id" que
    aparece en el atributo "comidas" del sensor "Comidas de hoy".
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    super_plato_id:
      name: ID del plato
      description: >-
        El "super_plato_id" del plato a valorar (ver atributo "comidas" del
        sensor comidas_hoy).
      required: true
      selector:
        text:
    rating:
      name: Valoración
      description: Puntuación de 1 a 5.
      required: true
      selector:
        number:
          min: 1
          max: 5
          step: 0.5
          mode: slider

opciones_plato:
  name: Ver opciones de plato
  description: >-
    Lista los platos alternativos disponibles para sustituir uno concreto en
    una franja horaria, ya formateados igual que los platos del sensor
    comidas_hoy (nombre, receta, ingredientes, imagen...). Solo lectura, no
    cambia nada. Usa el "plato_id" de la opción elegida como
    "nuevo_plato_id" de la acción "cambiar_plato".
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    plato_id:
      name: ID del plato actual
      description: >-
        El "plato_id" (no el super_plato_id) del plato que quieres sustituir,
        del atributo "comidas" del sensor comidas_hoy.
      required: true
      selector:
        text:
    franja:
      name: Franja
      description: >-
        La franja horaria (p. ej. "desayuno", "comida", "cena") - el
        atributo "franja" de la comida en cuestión.
      required: true
      selector:
        text:

cambiar_plato:
  name: Cambiar plato
  description: >-
    Sustituye un plato del plan activo por otro. IMPORTANTE: esto modifica tu
    plan real en DietoPro, no es reversible desde Home Assistant (aunque
    puedes volver a cambiarlo desde la app). El campo "dieta" nunca se pudo
    confirmar del todo contra una cuenta con más de una dieta - revisa el
    resultado en la app tras usarlo si tu plan tiene varios horarios.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    plan_id:
      name: ID del plan
      description: El "plan_id" del atributo del sensor "Comidas de hoy".
      required: true
      selector:
        text:
    dieta:
      name: Índice de la dieta
      description: >-
        El "dieta_index" del atributo del sensor "Comidas de hoy" (casi
        siempre 0).
      required: true
      selector:
        number:
          min: 0
          max: 10
          mode: box
    franja:
      name: Franja
      description: >-
        La franja horaria (p. ej. "comida") - el atributo "franja" de la
        comida en cuestión.
      required: true
      selector:
        text:
    plato_actual_id:
      name: ID del plato a sustituir
      description: >-
        El "plato_id" (no el subingesta_id) del plato que se va a reemplazar,
        del atributo "comidas" del sensor comidas_hoy.
      required: true
      selector:
        text:
    nuevo_plato_id:
      name: ID del nuevo plato
      description: >-
        El "plato_id" de la opción elegida (resultado de la acción
        "opciones_plato").
      required: true
      selector:
        text:

obtener_comidas:
  name: Obtener comidas de un plan
  description: >-
    Solo lectura. Devuelve todos los días (dietas) de un plan, con sus
    comidas y el resumen nutricional de cada día. Sin "plan_id" usa el plan
    actual; con él puedes consultar planes anteriores.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    plan_id:
      name: ID del plan
      description: Plan a consultar (ver atributo "planes" del sensor Plan actual).
      required: false
      selector:
        text:

lista_compra:
  name: Lista de la compra
  description: >-
    Suma los ingredientes de todos los días de un plan (o solo de los días
    indicados) en una lista de la compra agrupada por categoría. Opcionalmente
    la añade a una lista de tareas/compra de Home Assistant.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    plan_id:
      name: ID del plan
      description: Sin indicar, usa el plan actual.
      required: false
      selector:
        text:
    dias:
      name: Días
      description: >-
        Índices de día a incluir (0 = lunes ... 6 = domingo). Sin indicar,
        todos.
      required: false
      selector:
        object:
    todo_entity:
      name: Lista de Home Assistant
      description: Si se indica, cada ingrediente se añade a esa lista.
      required: false
      selector:
        entity:
          domain: todo

enviar_mensaje:
  name: Enviar mensaje al dietista
  description: >-
    Envía un mensaje de chat a tu dietista. IMPORTANTE: escribe en tu cuenta
    real de DietoPro y tu dietista lo verá.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    texto:
      name: Mensaje
      description: Texto a enviar (máximo 2000 caracteres).
      required: true
      selector:
        text:
          multiline: true

citas_disponibles:
  name: Ver huecos libres para cita
  description: >-
    Solo lectura. Devuelve los huecos libres para pedir cita entre dos fechas
    (por defecto, los próximos 7 días).
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    desde:
      name: Desde
      description: Primer día (por defecto, hoy).
      required: false
      selector:
        date:
    hasta:
      name: Hasta
      description: Último día (por defecto, 6 días después de "desde").
      required: false
      selector:
        date:

solicitar_cita:
  name: Solicitar cita
  description: >-
    Pide una cita en un hueco libre (usa los datos de "citas_disponibles").
    IMPORTANTE: crea una solicitud real en tu cuenta de DietoPro.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    fecha:
      name: Fecha
      description: Día del hueco elegido.
      required: true
      selector:
        date:
    hora:
      name: Hora
      description: Hora del hueco, tal y como la devuelve "citas_disponibles" (p. ej. 17:30).
      required: true
      selector:
        text:
    nota:
      name: Nota
      description: Comentario opcional para el dietista.
      required: false
      selector:
        text:
          multiline: true

confirmar_cita:
  name: Confirmar cita
  description: >-
    Confirma una cita propuesta por el dietista. Sin "cita_id" usa la de la
    próxima cita. IMPORTANTE: cambia tu cuenta real de DietoPro.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    cita_id:
      name: ID de la cita
      description: Opcional; por defecto, el "cita_id" del sensor Próxima cita.
      required: false
      selector:
        text:

cancelar_cita:
  name: Cancelar cita
  description: >-
    Cancela una cita. Sin "cita_id" cancela la próxima cita. IMPORTANTE:
    cambia tu cuenta real de DietoPro y no se puede deshacer desde Home
    Assistant.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    cita_id:
      name: ID de la cita
      description: Opcional; por defecto, el "cita_id" del sensor Próxima cita.
      required: false
      selector:
        text:

opciones_alimento:
  name: Ver alimentos equivalentes
  description: >-
    Solo lectura. Para un alimento suelto del plan (p. ej. una pechuga de
    pollo), lista los alimentos equivalentes con la cantidad que le
    corresponde a cada uno. Usa "alimento_id" y "cantidad" del atributo
    "comidas" del sensor Comidas de hoy.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    alimento_id:
      name: ID del alimento
      description: El "alimento_id" del alimento a sustituir.
      required: true
      selector:
        text:
    cantidad:
      name: Cantidad
      description: La "cantidad" actual del alimento (gramos).
      required: true
      selector:
        number:
          min: 0
          max: 5000
          mode: box

cambiar_alimento:
  name: Cambiar alimento
  description: >-
    Sustituye un alimento suelto del plan activo por otro equivalente.
    IMPORTANTE: modifica tu plan real en DietoPro.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    plan_id:
      name: ID del plan
      description: El "plan_id" del sensor Comidas de hoy.
      required: true
      selector:
        text:
    dieta:
      name: Índice de la dieta
      description: El "dieta_index" del sensor Comidas de hoy.
      required: true
      selector:
        number:
          min: 0
          max: 10
          mode: box
    franja:
      name: Franja
      description: La franja (p. ej. "tentempie1").
      required: true
      selector:
        text:
    alimento_actual_id:
      name: ID del alimento actual
      description: El "alimento_id" del alimento a sustituir.
      required: true
      selector:
        text:
    cantidad_actual:
      name: Cantidad actual
      description: La "cantidad" actual de ese alimento.
      required: true
      selector:
        number:
          min: 0
          max: 5000
          mode: box
    nuevo_alimento_id:
      name: ID del nuevo alimento
      description: El "alimento_id" elegido en "opciones_alimento".
      required: true
      selector:
        text:
    nueva_cantidad:
      name: Cantidad nueva
      description: La "cantidad" que indica "opciones_alimento" para el nuevo alimento.
      required: true
      selector:
        number:
          min: 0
          max: 5000
          mode: box

marcar_comida:
  name: Marcar comida como tomada
  description: >-
    Marca (o desmarca) una comida del día como tomada. Se guarda solo en Home
    Assistant (no se envía nada a DietoPro) y alimenta el sensor "Comidas
    tomadas hoy" y el cumplimiento semanal.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    franja:
      name: Franja
      description: desayuno, tentempie1, comida, merienda1, cena...
      required: true
      selector:
        text:
    tomada:
      name: Tomada
      description: Desactívalo para desmarcarla.
      required: false
      default: true
      selector:
        boolean:
    fecha:
      name: Fecha
      description: Por defecto, hoy.
      required: false
      selector:
        date:

medicion_abierta:
  name: Ver si hay una medición abierta
  description: >-
    Solo lectura. Indica si tu dietista tiene abierta una medición para que la
    rellenes (la app de DietoPro la pide por pasos). Úsala antes de
    "registrar_medicion".
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge

registrar_medicion:
  name: Registrar medición
  description: >-
    Manual y opcional. Rellena la medición que tu dietista tiene abierta con
    los valores que indiques y, por defecto, la cierra. IMPORTANTE: escribe en
    tu cuenta real y el dietista lo ve. No puede crear una medición nueva: debe
    estar abierta en DietoPro.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    peso:
      name: Peso
      description: Peso en kg.
      required: false
      selector:
        number:
          min: 20
          max: 400
          step: 0.1
          unit_of_measurement: "kg"
          mode: box
    porcentaje_grasa:
      name: Grasa corporal
      description: Porcentaje de grasa.
      required: false
      selector:
        number:
          min: 1
          max: 80
          step: 0.1
          unit_of_measurement: "%"
          mode: box
    porcentaje_agua:
      name: Agua corporal
      description: Porcentaje de agua.
      required: false
      selector:
        number:
          min: 1
          max: 90
          step: 0.1
          unit_of_measurement: "%"
          mode: box
    porcentaje_masa_magra:
      name: Masa magra
      description: Porcentaje de masa magra.
      required: false
      selector:
        number:
          min: 1
          max: 99
          step: 0.1
          unit_of_measurement: "%"
          mode: box
    perimetro_cintura:
      name: Cintura
      description: Perímetro en cm.
      required: false
      selector:
        number:
          min: 20
          max: 300
          step: 0.1
          unit_of_measurement: "cm"
          mode: box
    perimetro_cadera:
      name: Cadera
      description: Perímetro en cm.
      required: false
      selector:
        number:
          min: 20
          max: 300
          step: 0.1
          unit_of_measurement: "cm"
          mode: box
    perimetro_pecho:
      name: Pecho
      description: Perímetro en cm.
      required: false
      selector:
        number:
          min: 20
          max: 300
          step: 0.1
          unit_of_measurement: "cm"
          mode: box
    perimetro_pierna:
      name: Pierna
      description: Perímetro en cm.
      required: false
      selector:
        number:
          min: 10
          max: 200
          step: 0.1
          unit_of_measurement: "cm"
          mode: box
    perimetro_brazo:
      name: Brazo
      description: Perímetro en cm.
      required: false
      selector:
        number:
          min: 5
          max: 100
          step: 0.1
          unit_of_measurement: "cm"
          mode: box
    finalizar:
      name: Cerrar la medición
      description: >-
        Si lo desactivas solo se guardan los valores y la cierras tú desde la
        app oficial.
      required: false
      default: true
      selector:
        boolean:

enviar_archivo_chat:
  name: Enviar foto o documento al chat
  description: >-
    Envía a tu dietista un archivo que esté en la máquina de Home Assistant
    (foto: jpg, png, heic...; documento: pdf...). Máximo 15 MB. IMPORTANTE:
    tu dietista lo verá.
  fields:
    config_entry_id:
      name: Cuenta
      description: >-
        Solo necesario si tienes más de una cuenta de Nutriplan Bridge
        configurada.
      required: false
      selector:
        config_entry:
          integration: nutriplan_bridge
    ruta:
      name: Ruta del archivo
      description: Por ejemplo /config/www/comida.jpg o /media/analitica.pdf.
      required: true
      selector:
        text:
    texto:
      name: Mensaje
      description: Texto opcional que acompaña al archivo.
      required: false
      selector:
        text:
