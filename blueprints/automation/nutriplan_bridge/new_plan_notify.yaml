blueprint:
  name: Nutriplan Bridge - Aviso de plan nuevo o mensaje del dietista
  description: >-
    Ejecuta una acción cuando entra en vigor un plan distinto
    ({{ title }}) o cuando llega un mensaje nuevo del dietista
    ({{ unread }}). Se basa en los eventos que lanza la integración.
  domain: automation
  source_url: https://github.com/MUbeira0/nutriplan-bridge/blob/master/blueprints/automation/nutriplan_bridge/new_plan_notify.yaml
  input:
    notify_action:
      name: Acción a ejecutar
      description: Variables disponibles - event (plan_changed o new_message), title, unread.
      selector:
        action: {}

mode: queued
max_exceeded: silent

trigger:
  - platform: event
    event_type: nutriplan_bridge_plan_changed
    id: plan_changed
  - platform: event
    event_type: nutriplan_bridge_new_message
    id: new_message

variables:
  event: "{{ trigger.id }}"
  title: "{{ trigger.event.data.get('title', '') }}"
  unread: "{{ trigger.event.data.get('unread', 0) }}"

action:
  - choose: []
    default: !input notify_action
